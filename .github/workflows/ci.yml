name: CI

on:
  push:
    branches: [main]
    paths:
      - "clippy/**"
      - "tests/**"
      - "docs/**"
      - "bin/**"
      - "scripts/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "clippy/**"
      - "tests/**"
      - "docs/**"
      - "bin/**"
      - "scripts/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e .[dev]
      - name: Lint (unused imports and names)
        run: python -m pyflakes clippy tests
      - name: Unit tests
        run: python -m pytest tests -q
      - name: Known vulnerabilities in dependencies
        run: python -m pip_audit --skip-editable
      - name: Package entry point
        run: clippy help
